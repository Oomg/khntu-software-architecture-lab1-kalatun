# Online Ticket Booking — deployment stand (Lab 6, variant A)
# One API process hosts in-memory event bus + consumers (from LR5).

services:
  edge-gateway:
    image: nginx:1.27-alpine
    container_name: khntu-edge-gateway
    ports:
      - "8443:8443"
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ticket-booking-api
    restart: unless-stopped

  ticket-booking-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-booking/api:1.0
    container_name: ticket-booking-api
    environment:
      - NODE_ENV=production
      - PORT=8080
    # internal only; external traffic via edge gateway
    expose:
      - "8080"
    restart: unless-stopped
