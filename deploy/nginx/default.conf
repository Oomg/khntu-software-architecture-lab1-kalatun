# KhNTU Edge Gateway [nginx-6.42]
# Terminates TLS on :8443 and proxies to ticket-booking-api

server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://ticket-booking-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS listener (self-signed or mounted certs in real stand)
server {
    listen 8443 ssl;
    server_name _;
    # For local stand without certs nginx may need ssl_certificate;
    # diagram path remains HTTPS/TLS1.3 :8443
    ssl_protocols TLSv1.3;
    location / {
        proxy_pass http://ticket-booking-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
